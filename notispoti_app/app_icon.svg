<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B221E"/>
      <stop offset="50%" stop-color="#121614"/>
      <stop offset="100%" stop-color="#0A0C0B"/>
    </linearGradient>

    <!-- Spotify Emerald Accent Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1ED760"/>
      <stop offset="100%" stop-color="#1DB954"/>
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="glowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#107C38"/>
      <stop offset="100%" stop-color="#22E06A"/>
    </linearGradient>

    <!-- Border Ring Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#384A3E"/>
      <stop offset="50%" stop-color="#1E2A22"/>
      <stop offset="100%" stop-color="#121814"/>
    </linearGradient>

    <!-- Soft Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Squircle Container (Material 3 Style) -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" filter="url(#shadow)"/>
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="url(#borderGrad)" stroke-width="4"/>

  <!-- Subtle ambient inner glow -->
  <circle cx="256" cy="230" r="150" fill="#1DB954" opacity="0.08" filter="blur(40px)"/>

  <!-- Central Symbol: Music Note Head & Stem transitioning into Sound Waves -->
  <!-- Note Head 1 (Left) -->
  <ellipse cx="180" cy="340" rx="46" ry="34" transform="rotate(-24 180 340)" fill="url(#emeraldGrad)"/>
  
  <!-- Note Head 2 (Right) -->
  <ellipse cx="320" cy="295" rx="46" ry="34" transform="rotate(-24 320 295)" fill="url(#emeraldGrad)"/>

  <!-- Vertical Stems -->
  <!-- Left Stem -->
  <rect x="204" y="165" width="16" height="175" rx="8" fill="url(#emeraldGrad)"/>
  
  <!-- Right Stem -->
  <rect x="344" y="125" width="16" height="170" rx="8" fill="url(#emeraldGrad)"/>

  <!-- Top Connecting Beam -->
  <path d="M 204 175 L 360 133 L 360 152 L 204 194 Z" fill="url(#glowGrad)"/>

  <!-- Radiating Notification / Broadcast Sound Arcs (Spotify Curve Heritage) -->
  <!-- Outer Arc (Top) -->
  <path d="M 125 150 C 205 110, 310 110, 390 150" fill="none" stroke="url(#emeraldGrad)" stroke-width="20" stroke-linecap="round" opacity="0.95" filter="url(#glow)"/>

  <!-- Mid Arc -->
  <path d="M 150 185 C 215 152, 300 152, 365 185" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" opacity="0.9"/>

  <!-- Inner Sync Indicator Dot / Wave -->
  <circle cx="256" cy="100" r="10" fill="#1ED760" filter="url(#glow)"/>
</svg>
